<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DVCOE Canteen System</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- Background layer -->
  <div class="bg-layer"></div>

  <!-- Top navigation and branding -->
  <header class="top-nav glass-panel">
    <div class="brand-wrap">
      <img class="brand-logo" src="dvcoelogo.webp" alt="DVCOE Logo">
      <div class="title">
        <h1 data-i18n="collegeTitle">DVCOE</h1>
        <p data-i18n="collegeSubtitle">College Canteen/Cafeteria</p>
      </div>
    </div>

    <div class="nav-actions">
      <button id="theme-toggle" class="icon-btn glass-btn" type="button" aria-label="Toggle theme">
        <span id="theme-icon" aria-hidden="true"></span>
      </button>

      <div class="language-wrap" id="language-wrap">
        <button id="language-toggle" class="language-toggle-btn glass-btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Select language">
          <span class="lang-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M3 12h18"></path>
              <path d="M12 3a13 13 0 0 1 0 18"></path>
              <path d="M12 3a13 13 0 0 0 0 18"></path>
            </svg>
          </span>
          <span id="language-current">EN</span>
          <svg class="lang-caret" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m6 9 6 6 6-6"></path>
          </svg>
        </button>

        <div id="language-dropdown" class="language-dropdown" role="listbox" aria-label="Language options">
          <button class="lang-option" type="button" data-lang="en" role="option">English</button>
          <button class="lang-option" type="button" data-lang="hi" role="option">Hindi</button>
          <button class="lang-option" type="button" data-lang="mr" role="option">Marathi</button>
          <button class="lang-option" type="button" data-lang="ja" role="option">Japanese</button>
        </div>
      </div>

    </div>
  </header>

  <!-- Main app shell: menu and cart -->
  <main class="app-shell">
    <section class="menu-section">
      <div class="section-head glass-panel">
        <h2 data-i18n="menuTitle">Menu</h2>
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
          <input type="text" id="search-bar" data-i18n-placeholder="searchPlaceholder" placeholder="Search menu...">
        </div>
      </div>

      <div id="menu"></div>
    </section>

    <aside id="cart" class="glass-panel">
      <h2 data-i18n="yourCart">Your Cart</h2>
      <ul id="cart-items"></ul>
      <div id="total">Total: ₹0</div>
      <button id="place-order" class="primary-btn" type="button" data-i18n="placeOrder">Place Order</button>
    </aside>
  </main>

  <!-- Current orders -->
  <section id="orders" class="glass-panel">
    <h2 data-i18n="currentOrders">Current Orders</h2>
    <ul id="order-list"></ul>
  </section>

  <!-- Order history -->
  <section id="history" class="glass-panel">
    <h2 data-i18n="orderHistory">Order History</h2>
    <ul id="history-list"></ul>
  </section>

  <!-- Footer -->
  <footer class="site-footer glass-panel">
    <div class="footer-content">
      <div class="footer-text">
        <p class="footer-label">DEVELOPED BY</p>
        <p class="footer-name">PRAVIN K JADHAV  (2026)</p>
      </div>
      <div class="footer-social" aria-label="Social links">
        <a class="social-btn" href="https://www.linkedin.com/in/pravinjadhav-work" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
          <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">

          </svg>
        </a>
        <a class="social-btn" href="https://wa.me/917028033110" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
          <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">

          </svg>
        </a>
        <a class="social-btn" href="mailto:thepravinjadhav07@gmail.com" aria-label="Gmail">
          <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M24 5.457v13.086c0 .4-.33.73-.73.73h-3.35v-8.1L12 13.74 4.08 11.176v8.1H.73A.73.73 0 0 1 0 18.543V5.457c0-.4.33-.73.73-.73h.87L12 11.1l10.4-6.373h.87c.4 0 .73.33.73.73z"></path>
          </svg>
        </a>
      </div>
    </div>
  </footer>

  <!-- Order details modal -->
  <div id="order-modal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal="true"></div>
    <div class="modal-content glass-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h3 id="modal-title" data-i18n="orderDetails">Order Details</h3>

      <div class="field-group">
        <label for="customer-name" data-i18n="nameLabel">Name</label>
        <input id="customer-name" type="text" data-i18n-placeholder="namePlaceholder" placeholder="Enter your name">
      </div>

      <div class="field-group">
        <label for="table-number" data-i18n="tableLabel">Table Number</label>
        <input id="table-number" type="text" data-i18n-placeholder="tablePlaceholder" placeholder="Enter table number">
      </div>

      <div class="modal-actions">
        <button id="cancel-order" class="ghost-btn" type="button" data-i18n="cancel">Cancel</button>
        <button id="confirm-order" class="primary-btn" type="button" data-i18n="confirmOrder">Confirm Order</button>
      </div>
    </div>
  </div>

  <!-- Toast notifications -->
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script src="script.js"></script>
</body>

</html>
